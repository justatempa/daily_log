# Daily Log · nginx 站点配置（log.911250.xyz）
# 用途：修复审查报告中的三项部署问题
#   1) 静态资源 Cache-Control 冲突（max-age=43200 + no-cache）→ 带哈希的
#      /_next/static/ 改为 public,max-age=31536000,immutable，消除每次全量重验证
#   2) 登录页 / 认证接口不应被缓存 → no-store
#   3) 缺失安全响应头 + X-Powered-By 泄露 → 见 nginx-security-headers.conf
#
# 部署方法（服务器上）：
#   cp deploy/nginx-security-headers.conf /etc/nginx/conf.d/
#   cp deploy/nginx-daily-log.conf        /etc/nginx/conf.d/daily-log.conf
#   nginx -t && systemctl reload nginx
#
# 前提：应用容器以 docker run -p 127.0.0.1:9999:9999（或仅监听 9999）运行；
# 若容器当前绑定 0.0.0.0:9999，也建议收紧为仅本机回环。

server {
    listen 80;
    server_name log.911250.xyz;
    # HTTP 一律跳转 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name log.911250.xyz;

    # 证书路径请按服务器实际位置修改（certbot / Let's Encrypt 默认路径）
    ssl_certificate     /etc/letsencrypt/live/log.911250.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/log.911250.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 隐藏上游技术栈，避免泄露 Next.js
    proxy_hide_header X-Powered-By;

    # 与上游唯一一次 add_header 出处（服务器级；location 内请自行 include 片段）
    include /etc/nginx/conf.d/nginx-security-headers.conf;

    # 带内容哈希的静态资源：一年 + immutable。
    # Next.js 哈希文件名永不变化，缓存命中后零请求，彻底消除 11 个 JS 块的条件重验证。
    # 注意：只用 add_header 设置 Cache-Control，不要再写 expires 指令，
    # 否则 nginx 会自行再生成一个 Cache-Control，重演“重复响应头”问题。
    location /_next/static/ {
        proxy_pass http://127.0.0.1:9999;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/conf.d/nginx-security-headers.conf;
    }

    # 登录页与认证会话接口：禁止任何缓存
    location = /login {
        proxy_pass http://127.0.0.1:9999;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/conf.d/nginx-security-headers.conf;
    }
    location /api/auth/ {
        proxy_pass http://127.0.0.1:9999;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/conf.d/nginx-security-headers.conf;
    }

    # 其余请求：兜底反代到 Next.js，HTML 交由应用自身决定缓存，不再叠加第二个头
    location / {
        proxy_pass http://127.0.0.1:9999;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/nginx-security-headers.conf;
    }

    client_max_body_size 10m;
}