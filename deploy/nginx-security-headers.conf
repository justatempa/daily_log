# Daily Log · nginx 安全响应头片段
# 注意：nginx 中一旦某个 location 出现 add_header，上级（server 级）的
# add_header 不会自动继承到该 location，因此本片段需要在 server 级和
# 每个自定义了 Cache-Control 的 location 内分别 include。

# HSTS：浏览器强制 HTTPS
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# 禁止 MIME 嗅探
add_header X-Content-Type-Options "nosniff" always;
# 禁止被 iframe 嵌套（与 CSP frame-ancestors 双保险）
add_header X-Frame-Options "DENY" always;
# 控制 Referer 携带范围，避免泄露完整 URL
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# 限制可用浏览器能力
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=()" always;
# CSP：Next.js 生产包需要 'unsafe-inline' 样式与行内引导脚本；如对接 Memos API，
# 把它的域名追加进 connect-src（例如 connect-src 'self' https://memos.example.com）
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;