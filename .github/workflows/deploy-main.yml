name: Deploy to Server

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t daily-log:${{ github.sha }} \
            -t daily-log:latest \
            .

      - name: Export image as archive
        run: docker save daily-log:latest | gzip > daily-log-image.tar.gz

      - name: Upload image archive to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 124.70.155.206
          username: root
          port: 22
          key: ${{ secrets.SSH_KEY }}
          source: daily-log-image.tar.gz
          target: /tmp

      - name: Load image and restart container on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 124.70.155.206
          username: root
          port: 22
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail

            APP_NAME="daily-log"
            APP_DIR="/opt/daily-log"
            IMAGE_ARCHIVE="/tmp/daily-log-image.tar.gz"
            PORT=13003

            mkdir -p "$APP_DIR"

            if [ ! -f "$APP_DIR/.env" ]; then
              printf '%s\n' \
                'NEXTAUTH_SECRET=change-me' \
                'NEXTAUTH_URL=http://124.70.155.206:13003' \
                'DATABASE_URL=file:/app/db.sqlite' \
                > "$APP_DIR/.env"
            fi

            if [ ! -f "$APP_DIR/db.sqlite" ]; then
              touch "$APP_DIR/db.sqlite"
            fi

            chown 1001:1001 "$APP_DIR/db.sqlite"
            chmod 660 "$APP_DIR/db.sqlite"

            docker load -i "$IMAGE_ARCHIVE"

            if docker ps -a --format '{{.Names}}' | grep -q "^${APP_NAME}$"; then
              docker rm -f "$APP_NAME"
            fi

            docker run -d \
              --name "$APP_NAME" \
              --restart unless-stopped \
              -p "${PORT}:${PORT}" \
              -v "$APP_DIR/db.sqlite:/app/db.sqlite" \
              -e BARK_SERVER_URL="${{ secrets.BARK_SERVER_URL }}" \
              -e BARK_DEVICE_KEY="${{ secrets.BARK_DEVICE_KEY }}" \
              --env-file "$APP_DIR/.env" \
              daily-log:latest

            rm -f "$IMAGE_ARCHIVE"

      - name: Build Bark notification message
        id: bark_message
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          case "$JOB_STATUS" in
            success) TITLE="daily_log 部署成功" ;;
            failure) TITLE="daily_log 部署失败" ;;
            cancelled) TITLE="daily_log 部署已取消" ;;
            *) TITLE="daily_log 部署：$JOB_STATUS" ;;
          esac

          SHORT_SHA="${SHA:0:7}"
          COMMIT_SUBJECT=$(printf '%s' "$COMMIT_MESSAGE" | head -n 1)
          NOW=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')

          BODY=$(printf '%s\n' \
            "仓库：$REPO" \
            "分支：$BRANCH" \
            "提交：$SHORT_SHA" \
            "触发：$ACTOR" \
            "运行：#$RUN_NUMBER" \
            "时间：$NOW")
          if [ -n "$COMMIT_SUBJECT" ]; then
            BODY="$BODY"$'\n'"说明：$COMMIT_SUBJECT"
          fi

          {
            printf 'title=%s\n' "$TITLE"
            printf 'body<<BARK_BODY_7d1e4c\n'
            printf '%s\n' "$BODY"
            printf 'BARK_BODY_7d1e4c\n'
          } >> "$GITHUB_OUTPUT"

      - name: Notify iOS via Bark
        uses: harryzcy/action-bark@v2.4.0
        with:
          status: ${{ job.status }}
          title: ${{ steps.bark_message.outputs.title || 'daily_log 部署通知' }}
          body: ${{ steps.bark_message.outputs.body || '通知内容生成失败，请查看 GitHub Actions 运行详情。' }}
          group: github
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          device_key: ${{ secrets.BARK_DEVICE_KEY }}
          bark_server_url: ${{ secrets.BARK_SERVER_URL }}
        if: always() # 无论成功/失败/取消都推送，pick up events even if the job fails or is canceled
